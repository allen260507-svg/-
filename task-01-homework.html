<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务01 - 登记并完成学校家庭作业</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div id="app" class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-xl border border-slate-200">
    
    <!-- 头部与返回 -->
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h2 class="text-lg font-black text-slate-900">🎒 任务 01：学校作业登记与打卡</h2>
        <p class="text-xs text-slate-500 mt-0.5">学生：<b class="text-indigo-600">{{ studentName }}</b> · 今日打卡奖励 +3 积分</p>
      </div>
      <button @click="goBack" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-600">
        ✕ 返回看板
      </button>
    </div>

    <!-- 作业输入表单 -->
    <div class="space-y-3 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1">语文作业内容 (允许留空)：</label>
        <input v-model="form.yuwen" placeholder="例如：背诵课文第2段、生字抄写两遍" class="w-full border rounded-xl p-2.5 font-bold outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">数学作业内容 (允许留空)：</label>
        <input v-model="form.shuxue" placeholder="例如：练习册第18页1至6题" class="w-full border rounded-xl p-2.5 font-bold outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">英语作业内容 (允许留空)：</label>
        <input v-model="form.yingyu" placeholder="例如：Unit 4 单词跟读与课文朗读" class="w-full border rounded-xl p-2.5 font-bold outline-none focus:border-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-bold text-slate-700 mb-1">作业用时 (分钟)：</label>
          <input v-model.number="form.durationMinutes" type="number" class="w-full border rounded-xl p-2 font-black text-slate-900 outline-none">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">质检模式：</label>
          <select v-model="form.mode" class="w-full border rounded-xl p-2 font-bold text-slate-700 outline-none bg-white">
            <option value="direct">直接打卡</option>
            <option value="ai">AI 逐题质检</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">拍照上传作业纸面 (可多选)：</label>
        <input type="file" multiple accept="image/*" @change="handleFiles" class="w-full text-xs">
        <div v-if="photoNames.length > 0" class="mt-1 text-[11px] text-emerald-600 font-bold">
          已选取 {{ photoNames.length }} 张作业照片
        </div>
      </div>
    </div>

    <!-- 提交与返回 -->
    <div class="pt-3 border-t flex space-x-3">
      <button @click="goBack" class="flex-1 py-2.5 border rounded-xl text-xs font-bold text-slate-600">取消返回</button>
      <button @click="submitHomework" class="flex-1 py-2.5 bg-slate-900 hover:bg-black text-white rounded-xl text-xs font-black shadow-md">
        确认提交打卡 (+3分)
      </button>
    </div>

  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
      setup() {
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student') || 'nuo';
        const dateKey = urlParams.get('date') || '2026-09-04';

        const studentName = ref(studentId);
        const form = ref({
          yuwen: '',
          shuxue: '',
          yingyu: '',
          durationMinutes: 35,
          mode: 'direct'
        });
        const photoNames = ref([]);

        onMounted(() => {
          // 读取学生姓名
          const rawStudents = localStorage.getItem('study_os_students');
          if (rawStudents) {
            const list = JSON.parse(rawStudents);
            const target = list.find(s => s.id === studentId);
            if (target) studentName.value = target.name;
          }

          // 回显已有输入
          const rawCheckins = localStorage.getItem('study_os_checkins');
          if (rawCheckins) {
            const checkins = JSON.parse(rawCheckins);
            const k = `${studentId}_${dateKey}`;
            if (checkins[k] && checkins[k].hwData) {
              form.value = { ...checkins[k].hwData };
            }
          }
        });

        const handleFiles = (e) => {
          photoNames.value = Array.from(e.target.files).map(f => f.name);
        };

        const goBack = () => {
          window.location.href = '../index.html';
        };

        const submitHomework = () => {
          const k = `${studentId}_${dateKey}`;
          const rawCheckins = localStorage.getItem('study_os_checkins');
          const checkins = rawCheckins ? JSON.parse(rawCheckins) : {};

          if (!checkins[k]) checkins[k] = { doneTaskIds: [], attachments: {} };
          
          const isAlreadyDone = checkins[k].doneTaskIds.includes(1);
          if (!isAlreadyDone) {
            checkins[k].doneTaskIds.push(1);
          }
          checkins[k].hwData = { ...form.value };
          localStorage.setItem('study_os_checkins', JSON.stringify(checkins));

          // 累加积分
          if (!isAlreadyDone) {
            const rawStudents = localStorage.getItem('study_os_students');
            if (rawStudents) {
              const list = JSON.parse(rawStudents);
              const target = list.find(s => s.id === studentId);
              if (target) target.points = (target.points || 0) + 3;
              localStorage.setItem('study_os_students', JSON.stringify(list));
            }
          }

          alert('🎉 作业登记完成，成功打卡获得 +3 积分！');
          goBack();
        };

        return {
          studentName,
          form,
          photoNames,
          handleFiles,
          goBack,
          submitHomework
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
